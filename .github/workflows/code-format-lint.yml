name: "Prettier Format & ESLint"

on:
  pull_request:
    branches: [ dev ]

jobs:
  format_and_lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: lts/Jod
      - run: yarn install --frozen-lockfile
      - run: yarn lint:check-config
      - run: yarn lint