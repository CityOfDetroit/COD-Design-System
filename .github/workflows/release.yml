name: Auto Release

on:
  push:
    branches:
      - main  # Only run on the main branch

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # This fetches the complete history for better changelog generation

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current version from package.json
        id: current_version
        run: |
          CURRENT_VERSION=$(jq -r '.version' package.json)
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV

      - name: Get previous version from Git
        id: previous_version
        run: |
          PREV_VERSION=$(git show HEAD~1:package.json | jq -r '.version')
          echo "PREV_VERSION=$PREV_VERSION" >> $GITHUB_ENV

      - name: Check if version has changed
        if: ${{ env.CURRENT_VERSION == env.PREV_VERSION }}
        run: |
          echo "Version has not changed. Exiting."
          exit 0

      - name: Create Tag
        if: ${{ env.CURRENT_VERSION != env.PREV_VERSION }}
        run: |
          git tag -a "v${{ env.CURRENT_VERSION }}" -m "Release version ${{ env.CURRENT_VERSION }}"
          git push origin "v${{ env.CURRENT_VERSION }}"

      - name: Generate Release Notes
        if: ${{ env.CURRENT_VERSION != env.PREV_VERSION }}
        id: generate_release_notes
        run: |
          # Get the date in the desired format
          RELEASE_DATE=$(date "+%a %b %d %Y")
          
          # Start building the release notes
          echo "# v${{ env.CURRENT_VERSION }} ($RELEASE_DATE)" > release_notes.md
          echo "" >> release_notes.md
          
          # Get all PRs since the last version using GitHub API
          # This requires a GitHub token with repo scope
          REPO_NAME="${GITHUB_REPOSITORY}"
          
          # Find the previous version tag in git
          PREV_TAG=$(git tag --sort=-v:refname | grep -E "^v${PREV_VERSION}$" || echo "")
          if [ -z "$PREV_TAG" ]; then
            # If no exact match, try to find the closest tag
            PREV_TAG=$(git tag --sort=-v:refname | head -n 1)
          fi
          
          # Get merged PRs between tags/versions
          echo "Fetching PRs between $PREV_TAG and HEAD..."
          
          # Function to categorize PRs based on title/labels
          categorize_prs() {
            local query="$1"
            local category="$2"
            local prs=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/search/issues?q=repo:${REPO_NAME}+is:pr+is:merged+merged:>=${PREV_TAG}+${query}" | \
              jq -r '.items[] | "- " + .title + " [#" + (.number|tostring) + "](https://github.com/'${REPO_NAME}'/pull/" + (.number|tostring) + ") by ([@" + .user.login + "](https://github.com/" + .user.login + "))"')
            
            if [ ! -z "$prs" ]; then
              echo "#### ${category}" >> release_notes.md
              echo "" >> release_notes.md
              echo "$prs" >> release_notes.md
              echo "" >> release_notes.md
            fi
          }
          
          # Categorize PRs based on labels or title keywords
          categorize_prs "label:bug OR title:fix OR title:bug" "🐛 Bug Fix"
          categorize_prs "label:enhancement OR title:feature OR title:add OR title:support OR title:create" "🚀 Enhancement"
          categorize_prs "label:documentation OR title:doc OR title:docs" "📝 Documentation"
          categorize_prs "label:internal OR title:internal OR title:refactor OR title:cleanup OR title:chore" "🏠 Internal"
          
          # Add full changelog link
          echo "**Full Changelog**: https://github.com/${REPO_NAME}/compare/${PREV_TAG}...v${{ env.CURRENT_VERSION }}" >> release_notes.md
          
          # Set the release notes as an output
          RELEASE_NOTES=$(cat release_notes.md)
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$RELEASE_NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        if: ${{ env.CURRENT_VERSION != env.PREV_VERSION }}
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v${{ env.CURRENT_VERSION }}"
          release_name: "Release v${{ env.CURRENT_VERSION }}"
          body: ${{ env.RELEASE_NOTES }}
          draft: false
          prerelease: false